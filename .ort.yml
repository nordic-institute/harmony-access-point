curations:
  license_findings:
    - path: "Core/Domibus-MSH/src/main/resources/config/infinispan/domibus-infinispan-default.xml"
      concluded_license: "LGPL-2.1-or-later"
      reason: "INCORRECT"
      comment: "Corrected scanner finding."

license_choices:
  repository_license_choices:
    - given: "LGPL-2.1-only OR EPL-1.0"
      choice: "LGPL-2.1-only"
    - given: "BSD-3-Clause AND Apache-2.0 AND W3C AND LicenseRef-Public-domain AND MIT AND Apache-1.1 AND SAX-PD AND (MIT OR GPL-1.0-or-later) AND EPL-1.0"
      choice: "BSD-3-Clause AND Apache-2.0 AND W3C AND LicenseRef-Public-domain AND MIT AND Apache-1.1 AND SAX-PD AND MIT AND EPL-1.0"
    - given: "CDDL-1.0 OR GPL-2.0-only WITH Classpath-exception-2.0"
      choice: "GPL-2.0-only WITH Classpath-exception-2.0"
    - given: "BSD-3-Clause AND Apache-2.0 AND (GPL-2.0-only OR GPL-2.0-only WITH Classpath-exception-2.0) AND MIT"
      choice: "BSD-3-Clause AND Apache-2.0 AND GPL-2.0-only WITH Classpath-exception-2.0 AND MIT"
    - given: "BSD-3-Clause AND Apache-2.0 AND W3C AND LicenseRef-scancode-public-domain AND MIT AND SAX-PD AND EPL-1.0 AND (Apache-2.0 OR Apache-1.1 OR BSD-3-Clause OR LicenseRef-scancode-public-domain OR LicenseRef-scancode-indiana-extreme) AND (MIT OR GPL-1.0-or-later)"
      choice: "BSD-3-Clause AND Apache-2.0 AND W3C AND LicenseRef-scancode-public-domain AND MIT AND SAX-PD AND EPL-1.0 AND BSD-3-Clause AND MIT"
