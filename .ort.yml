      comment: "The files in the package have no license."
    - message: "copyleft-strong license GPL-2.0-only in Maven:javax.jws:jsr181-api:1.0-MR1."
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The files in the package have no license."
    - message: "copyleft-strong license GPL-2.0-or-later WITH Autoconf-exception-2.0 in Maven:antlr:antlr:2.7.7."
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The license requires distribution under GPL terms but provides an exception for projects using Autoconf-generated configuration scripts, permitting them to be licensed under the same terms as the rest of the project."
    - message: "copyleft-strong license GPL-2.0-only in Maven:javax.jws:jsr181-api:1.0-MR1."
