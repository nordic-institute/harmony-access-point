---
excludes:
  paths:
    - pattern: ".mvn/wrapper/**"
      reason: "BUILD_TOOL_OF"
      comment: "This is a build tool."

    - pattern: "Plugin-FS/**"
      reason: "OPTIONAL_COMPONENT_OF"
      comment: "Not included in distributed build artifacts."

    - pattern: "Plugin-JMS/**"
      reason: "OPTIONAL_COMPONENT_OF"
      comment: "Not included in distributed build artifacts."

    - pattern: "Plugin-WS/Domibus-default-ws-plugin-backend-ws-test/**"
      reason: "TEST_OF"
      comment: "This directory contains tests."

    - pattern: "Weblogic/**"
      reason: "OPTIONAL_COMPONENT_OF"
      comment: "Not included in distributed build artifacts."

    - pattern: "Wildfly/**"
      reason: "OPTIONAL_COMPONENT_OF"
      comment: "Not included in distributed build artifacts."

    - pattern: "license/**"
      reason: "OTHER"
      comment: "This directory includes 3rd party license files."

    - pattern: "third-party/**"
      reason: "DOCUMENTATION_OF"
      comment: "The directory contains third party license notices. The package itself does not contain the files referenced in the license notice."

    - pattern: "Core/Domibus-MSH-distribution/**"
      reason: "OPTIONAL_COMPONENT_OF"
      comment: "Not included in distributed build artifacts."

    - pattern: "Core/Domibus-MSH-soapui-tests/**"
      reason: "TEST_OF"
      comment: "This directory contains tests."

    - pattern: "Core/Domibus-MSH-swagger/**"
      reason: "OPTIONAL_COMPONENT_OF"
      comment: "Not included in distributed build artifacts."

    - pattern: "Core/Domibus-MSH-test/**"
      reason: "TEST_OF"
      comment: "This directory contains tests."

    - pattern: "Core/Domibus-MSH-test-common/**"
      reason: "TEST_OF"
      comment: "This directory contains tests."

    - pattern: "**/src/test/**"
      reason: "TEST_OF"
      comment: "This directory contains unit tests."

    - pattern: ".ort.yml"
      reason: "DOCUMENTATION_OF"
      comment: "The file is a oss review toolkit configuration file."

    - pattern: "Notice.md"
      reason: "OTHER"
      comment: "This file includes a list of 3rd party libraries."

    - pattern: "THIRD-PARTY.txt"
      reason: "OTHER"
      comment: "This file includes a list of 3rd party libraries."

    - pattern: "mvnw"
      reason: "BUILD_TOOL_OF"
      comment: "This is a build tool."

    - pattern: "mvnw.cmd"
      reason: "BUILD_TOOL_OF"
      comment: "This is a build tool."

  scopes:
    - pattern: "checkstyle"
      reason: "BUILD_DEPENDENCY_OF"
      comment: "Packages for code styling checks (testing) only."

    - pattern: "devDependencies"
      reason: "DEV_DEPENDENCY_OF"
      comment: "Packages for development only."

    - pattern: "jacocoAgent"
      reason: "TEST_DEPENDENCY_OF"
      comment: "Packages for code coverage (testing) only."

    - pattern: "jacocoAnt"
      reason: "TEST_DEPENDENCY_OF"
      comment: "Packages for code coverage (testing) only."

    - pattern: "test.*"
      reason: "TEST_DEPENDENCY_OF"
      comment: "Packages for testing only."

    - pattern: "annotationProcessor"
      reason: "DEV_DEPENDENCY_OF"
      comment: "Packages for development only."

    - pattern: "compileClasspath"
      reason: "DEV_DEPENDENCY_OF"
      comment: "Packages for development only."

    - pattern: "compileOnly"
      reason: "DEV_DEPENDENCY_OF"
      comment: "Packages for development only."

resolutions:
  rule_violations:
    - message: ".*EUPL-1.2.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "EUPL-1.2 is the main license of the project."
    - message: ".*EUPL-1.1.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "EUPL-1.2 is the main license of the project and EUPL-1.1 is upward compatible."
    - message: "copyleft-LGPL license LGPL-2.1-only in Maven:org.niis:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The package's main license is EUPL-1.2, and LGPL-2.1 is compatible with the main license."
    - message: "copyleft-LGPL license LGPL-2.1-or-later in Maven:org.niis:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The package's main license is EUPL-1.2, and LGPL-2.1 is compatible with the main license."
    - message: "copyleft-LGPL license LGPL-2.1-or-later in Maven:com.mchange:c3p0:0.9.5.4."
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The package's main license is EUPL-1.2, and LGPL-2.1 is compatible with the main license."
    - message: "copyleft-LGPL license LGPL-2.1-or-later in Maven:com.mchange:mchange-commons-java:0.2.15."
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The package's main license is EUPL-1.2, and LGPL-2.1 is compatible with the main license."
    - message: "free-restricted license LicenseRef-scancode-hazelcast-community-1.0 in Maven:com.hazelcast:hazelcast.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "As the NIIS application doesn't compete with Hazelcast offering, the license conditions are satisfied."
    - message: ".*LicenseRef-scancode-sun-jsr-spec-04-2006.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "A specification license."
    - message: "proprietary-free license LicenseRef-scancode-iptc-2006 in Maven:org.apache.tika:tika-core:2.7.0."
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "A specification license."
    - message: ".*LicenseRef-scancode-efsl-1.0.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "A specification license."
    - message: "copyleft-strong license GPL-1.0-or-later in Maven:org.jvnet.staxex:stax-ex:1.8.3."
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "License notice file. The package contains only BSD-3-Clause files, while referenced licenses likely apply to dependencies or external components."
    - message: "copyleft-strong license GPL-1.0-or-later in Maven:com.sun.xml.fastinfoset:FastInfoset:1.2.18."
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "License notice file. The package contains only Apache-2.0 files, while referenced licenses likely apply to dependencies or external components."
    - message: "copyleft-strong license GPL-1.0-or-later in Maven:com.sun.istack:istack-commons-runtime:3.0.12."
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "License notice file. The package contains only BSD-3-Clause files, while referenced licenses likely apply to dependencies or external components."
    - message: "copyleft-strong license GPL-2.0-only in Maven:javax.jws:jsr181-api:1.0-MR1."
