      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The file is deemed to be separate and distinct from the other parts of the package and therefore seen as mere aggregation. The license obligations of GPL-2.0-or-later do not cover the whole."
    - message: "copyleft-LGPL license LGPL-3.0-only in Maven:org.niis:harmony:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "License notice file."
    - message: "copyleft-file-level license CDDL-1.0 in Maven:org.niis:harmony:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "License notice file."
    - message: "copyleft-file-level license EPL-2.0 in Maven:org.niis:harmony:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "License notice file."
    - message: "copyleft-file-level license MPL-1.1 in Maven:org.niis:harmony:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "License notice file."
    - message: "copyleft-file-level license MPL-2.0 in Maven:org.niis:harmony:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "License notice file."
    - message: "copyleft-file-level license CDDL-1.1 in Maven:org.niis:harmony:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "License notice file."
    - message: "copyleft-module-level license EPL-1.0 in Maven:org.niis:harmony:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "License notice file."
    - message: "copyleft-module-level license GPL-2.0-only WITH Classpath-exception-2.0 in Maven:org.niis:harmony:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "License notice file."
    - message: "copyleft-strong license GPL-2.0-or-later WITH Classpath-exception-2.0 in Maven:org.niis:harmony:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "License notice file."
    - message: "Strong copyleft in open source project code GPL-2.0-or-later WITH Classpath-exception-2.0 in Maven:org.niis:harmony:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "License notice file."
    - message: "copyleft-module-level license GPL-2.0-only WITH Linux-syscall-note in Maven:org.niis:harmony:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
